<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Hi, my name is Roman Yanke."
    />
    <!-- the standard name; the apple- prefixed one is still read by older iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta name="theme-color" content="#f9f3f0" />
    <meta property="og:title" content="Roman Yanke" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yanke.world" />
    <meta
      property="og:description"
      content="Hi, my name is Roman Yanke."
    />
    <!-- absolute, and served from public/ so the path keeps no build hash:
         crawlers cannot resolve a relative og:image -->
    <meta
      property="og:image"
      content="https://yanke.world/og.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="apple-touch-icon"
      href="src/assets/logo192.png"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="src/assets/favicon.ico" />
    <title>Roman Yanke</title>
    <style>
      @import 'src/app.css';
    </style>
  </head>

  <body>
    <header>
      <h1>Roman Yanke</h1>
      <picture>
        <source
          srcset="
            src/assets/romanyanke.webp,
            src/assets/romanyanke@2x.webp 2x,
            src/assets/romanyanke@3x.webp 3x
          "
          type="image/webp"
        />
        <!-- decorative: the h1 above carries the same information -->
        <img src="src/assets/romanyanke.jpg" alt="" />
      </picture>
      <button class="sky" type="button">
        <span class="sun" aria-hidden="true">🌞</span>
        <span class="moon" aria-hidden="true">🌛</span>
      </button>
      <inline svg="src/assets/squircle.svg" />
    </header>

    <main>
      <dl>
        <dt>Handle</dt>
        <dd>
          <div class="links">
            <span>romanyanke</span>
            <a
              href="https://twitter.com/romanyanke"
              aria-label="Twitter"
              title="Twitter"
            >
              <inline svg="src/assets/twitter.svg" />
            </a>
            <a
              href="https://instagram.com/romanyanke"
              aria-label="Instagram"
              title="Instagram"
            >
              <inline svg="src/assets/instagram.svg" />
            </a>
            <a
              href="https://t.me/romanyanke"
              aria-label="Telegram"
              title="Telegram"
            >
              <inline svg="src/assets/telegram.svg" />
            </a>
            <a
              href="https://me.yanke.ru/"
              aria-label="Tumblr"
              title="Tumblr"
            >
              <inline svg="src/assets/tumblr.svg" />
            </a>
            <a
              href="https://github.com/romanyanke"
              aria-label="GitHub"
              title="GitHub"
            >
              <inline svg="src/assets/github.svg" />
            </a>
            <a
              href="https://linkedin.com/in/romanyanke"
              aria-label="LinkedIn"
              title="LinkedIn"
            >
              <inline svg="src/assets/linkedin.svg" />
            </a>
          </div>
        </dd>
        <dt>Position</dt>
        <dd>
          Lead Frontend Engineer at
          <a href="https://www.simplinic.de">simplinic</a>
        </dd>
        <dt>About</dt>
        <dd>
          I have
          <a href="https://pencil.yanke.world/" id="pencils"
            >a collection of pencils</a
          >
        </dd>
        <dt>Residence</dt>
        <dd>
          Berlin, Germany
          <span aria-label="Flag of Germany" role="img"
            >🇩🇪</span
          >
        </dd>
        <dt>Email</dt>
        <dd>
          <a href="mailto:roman@yanke.world"
            >roman@yanke.world</a
          >
        </dd>
      </dl>
    </main>

    <script type="module" async src="src/app.ts"></script>
  </body>
</html>
